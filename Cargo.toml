[package]
name = "sigshare"
version = "0.1.0-alpha.2"
edition = "2024"
authors = ["Marcus Cvjeticanin <mjovanc@icloud.com>"]
rust-version = "1.85"
description = "OpenID Shared Signals (SSF/CAEP/RISC) and Security Event Tokens for Rust"
license = "MIT OR Apache-2.0"
keywords = ["caep", "security-event-token", "openid", "zero-trust", "risc"]
categories = ["authentication", "web-programming"]
repository = "https://github.com/mjovanc/sigshare"
homepage = "https://github.com/mjovanc/sigshare"
readme = "README.md"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.13", features = ["json"], optional = true }
url = "2"
